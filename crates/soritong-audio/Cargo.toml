[package]
name = "soritong-audio"
description = "Output devices and playback for soritong: the virtual-mic sink plus an optional monitor."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
soritong-core.workspace = true
serde.workspace = true
thiserror.workspace = true
cpal = "0.18"
rubato = "5"
log = "0.4"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
]
