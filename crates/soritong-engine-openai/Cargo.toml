[package]
name = "soritong-engine-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI-compatible /v1/audio/speech TTS engine for soritong"

[dependencies]
soritong-core = { path = "../soritong-core" }
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
url = "2.5"
